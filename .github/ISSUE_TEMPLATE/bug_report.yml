name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include private images, credentials, or exploit details in a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Add...
        3. Select...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, GPU, VRAM, RAM, browser or desktop build, ComfyUI version, adapter, model, and workflow.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal paths, prompts, credentials, and private media.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I can reproduce this with a project that does not contain private content.
          required: false
