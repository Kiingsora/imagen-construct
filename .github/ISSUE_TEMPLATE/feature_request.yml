name: Feature request
description: Propose a focused product improvement
title: "feat: "
labels:
  - type:feature
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem before describing the solution.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow
      description: How does a user handle this today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      options:
        - MVP 0 — Interaction prototype
        - MVP 1 — Local generative proof
        - Editing and import
        - Context awareness
        - Scene intelligence
        - Packaging and ecosystem
        - Unsure
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the feature complete.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The proposal preserves the layer-first model.
        - label: The proposal can remain local-first or optional.
        - label: The proposal does not require coupling the editor to one model.
